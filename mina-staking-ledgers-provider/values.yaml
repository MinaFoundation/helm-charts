# -- Number of replicas. Must stay 1: the ledger volume is ReadWriteOnce and the
# fetch loop writes into it in place. The template refuses any other value.
replicaCount: 1

image:
  # -- Image for the fetch loop. Must provide kubectl, python3 and curl; it
  # drives the Mina daemon through `kubectl exec`, since a staking ledger is
  # available by no other interface. tar is NOT needed here - the archive is
  # packed on the daemon pod. The script fails loudly at startup if any of the
  # three is missing.
  #
  # Public on purpose, so this chart carries no private-registry dependency.
  repository: alpine/k8s
  # -- Image tag. Track the cluster's Kubernetes minor version: kubectl supports
  # only +/-1 minor against the API server, and this uses exec and cp.
  tag: "1.35.6"
  # -- Image pull policy
  pullPolicy: IfNotPresent

# -- Image pull secrets
imagePullSecrets: []
# -- The release name override
nameOverride: ""
# -- The full release name override. Worth setting to
# `mina-staking-ledgers-provider`: consumers address this by Service name, and
# the decentralized-treasury chart defaults to exactly that host.
fullnameOverride: ""

# -- Where ledgers are written and served from
ledgersDirectory: /data

# -- Label selector identifying candidate Mina daemon pods, e.g.
# `queryableNode=true`. Every match is probed and the first reporting
# `sync_status: Synced` is used - exporting from an unsynced node yields a
# ledger for a chain the network is not following.
minaNodeLabel: ""
# -- Container name within the daemon pod
minaContainer: mina

# -- Cheap probe endpoint, typically a Service such as
# http://graphql-proxy:3085/graphql. Used only to decide whether there is any
# work to do: when the ledgers the chain advertises are already published the
# cycle ends there, having touched no pod at all - the common case, since an
# epoch lasts days and polling is hourly. Leaving it empty still works, but then
# every cycle execs into pods just to discover there is nothing to do.
#
# Deliberately not trusted for the export itself; see minaGraphqlPort.
minaNodeUrl: ""

# -- GraphQL port on the daemon pod. Queried on the pod's own IP, not through a
# Service: the ledger hash must come from the very node the export runs on, and
# a Service balances across whatever matches its own selector - which is not the
# selector used to pick the synced pod here. That pre-check is what lets a cycle
# skip an export it does not need, and it also verifies the export afterwards.
minaGraphqlPort: 3085
# -- Namespace holding the Mina daemon. Empty means the release namespace.
minaNamespace: ""

# -- Also export the next epoch's ledger. next(N) is byte-identical to
# staking(N+1), so publishing it early gives consumers up to a full epoch of
# head start on a build whose tracing step alone runs for hours.
exportNextEpoch: true

# -- How many archives to keep, newest first. Generous on purpose: a treasury
# lifecycle can need a ledger several epochs old, and one the daemon has moved
# past cannot be re-exported at any price.
keepLastN: 4

# -- How often to look for a new epoch, in seconds
pollIntervalSeconds: 3600

# -- Additional environment variables for the fetch container
extraEnvVars: []

## Read-only HTTP service over the ledger directory. This is how consumers in
## the namespace enumerate and download archives; nothing leaves the cluster.
server:
  image:
    # -- Image for the serving container
    repository: nginxinc/nginx-unprivileged
    # -- Image tag
    tag: "1.27-alpine"
    # -- Image pull policy
    pullPolicy: IfNotPresent
  # -- Port the ledger directory is served on. 8080 rather than 80 because the
  # unprivileged nginx image cannot bind a privileged port.
  port: 8080
  # -- Security context for the serving container
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 101
    capabilities:
      drop:
        - ALL
  # -- Resources for the serving container
  resources: {}

persistence:
  # -- Use an existing claim instead of creating one
  existingClaim: ""
  # -- Storage class for the ledger volume
  storageClass: ebs-gp3-encrypted
  # -- Access mode. ReadWriteOnce is what EBS supports, which is why this chart
  # serves over HTTP rather than sharing the volume with its consumer.
  accessMode: ReadWriteOnce
  # -- Volume size. A devnet ledger is ~140MB raw and compresses to roughly a
  # fifth of that, so this holds a comfortable number of epochs.
  size: 20Gi

serviceAccount:
  # -- Whether to create a service account
  create: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- Name of the service account to use
  name: ""

rbac:
  # -- Create the Role and RoleBinding granting pod exec on the Mina daemon
  create: true

# -- Annotations to add to the pod
podAnnotations: {}
# -- Pod security context
podSecurityContext:
  fsGroup: 1000
# -- Security context for the fetch container. The image defaults to root, which
# it does not need: kubectl, curl and python3 all run fine unprivileged, and
# fsGroup above makes the ledger volume writable at uid 1000.
securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL
# -- Resources for the fetch container. The ledger is streamed through, but
# `mina ledger export` output is buffered locally before it is packed.
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 2Gi

# -- Node selector labels
nodeSelector: {}
# -- Tolerations
tolerations: []
# -- Affinity rules
affinity: {}
