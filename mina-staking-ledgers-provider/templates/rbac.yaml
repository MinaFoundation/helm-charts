{{- if .Values.rbac.create }}
{{/*
Scoped to the namespace holding the Mina daemon. exec is unavoidable: the
ledger is produced by running `mina ledger export` inside the daemon, which
exposes it over no other interface.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "mina-staking-ledgers-provider.fullname" . }}
  {{- with .Values.minaNamespace }}
  namespace: {{ . }}
  {{- end }}
  labels:
    {{- include "mina-staking-ledgers-provider.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "mina-staking-ledgers-provider.fullname" . }}
  {{- with .Values.minaNamespace }}
  namespace: {{ . }}
  {{- end }}
  labels:
    {{- include "mina-staking-ledgers-provider.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "mina-staking-ledgers-provider.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "mina-staking-ledgers-provider.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
