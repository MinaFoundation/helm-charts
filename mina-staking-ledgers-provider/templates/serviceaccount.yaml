{{- if eq (include "mina-staking-ledgers-provider.serviceAccountName" .) (include "mina-staking-ledgers-provider.serverServiceAccountName" .) -}}
{{- fail "fetch and serve require distinct service accounts" -}}
{{- end -}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mina-staking-ledgers-provider.serviceAccountName" . }}
  labels:
    {{- include "mina-staking-ledgers-provider.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mina-staking-ledgers-provider.serverServiceAccountName" . }}
  labels:
    {{- include "mina-staking-ledgers-provider.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
