apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mina-staking-ledgers-provider.fullname" . }}-serve
  labels:
    {{- include "mina-staking-ledgers-provider.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "mina-staking-ledgers-provider.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: serve
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "mina-staking-ledgers-provider.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: serve
    spec:
      serviceAccountName: {{ include "mina-staking-ledgers-provider.serverServiceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "mina-staking-ledgers-provider.selectorLabels" . | nindent 18 }}
                  app.kubernetes.io/component: fetch
              topologyKey: kubernetes.io/hostname
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: serve
          image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          command: ["nginx", "-c", "/etc/nginx/nginx.conf", "-g", "daemon off;"]
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
          {{- with .Values.server.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.server.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: scripts
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: ledgers
              mountPath: {{ .Values.ledgersDirectory }}
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: {{ include "mina-staking-ledgers-provider.fullname" . }}
            defaultMode: 0555
        - name: ledgers
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "mina-staking-ledgers-provider.fullname" .) }}
            readOnly: true
