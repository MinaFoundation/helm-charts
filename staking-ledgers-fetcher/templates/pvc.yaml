{{- if not .Values.persistence.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "staking-ledgers-fetcher.fullname" . }}
  labels:
    {{- include "staking-ledgers-fetcher.labels" . | nindent 4 }}
  annotations:
    # The ledgers are expensive to reproduce and impossible to recover once the
    # daemon has moved past that epoch, so the claim outlives the release.
    helm.sh/resource-policy: keep
spec:
  accessModes: [{{ .Values.persistence.accessMode }}]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
