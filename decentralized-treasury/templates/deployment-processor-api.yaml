{{- if .Values.processorApi.enabled }}
{{- $component := "processor-api" }}
{{- $ctx := dict "root" $ "component" $component }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "decentralized-treasury.componentName" $ctx }}
  labels:
    {{- include "decentralized-treasury.componentLabels" $ctx | nindent 4 }}
  {{- with .Values.processorApi.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.processorApi.replicaCount }}
  selector:
    matchLabels:
      {{- include "decentralized-treasury.componentSelectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pods when the wait-for-migrations script changes.
        checksum/scripts: {{ include (print $.Template.BasePath "/configmap-scripts.yaml") . | sha256sum }}
        {{- with .Values.processorApi.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "decentralized-treasury.componentLabels" $ctx | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "decentralized-treasury.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "decentralized-treasury.waitForMigrations" (dict "root" $ "image" .Values.processorApi.image) | nindent 8 }}
      containers:
        # Unlike indexer-api, this entrypoint calls dataSource.initialize()
        # before it starts listening, so an unreachable or unmigrated database
        # exits the process rather than serving errors.
        - name: {{ $component }}
          image: {{ include "decentralized-treasury.componentImage" (dict "root" $ "image" .Values.processorApi.image) }}
          imagePullPolicy: {{ include "decentralized-treasury.componentPullPolicy" (dict "root" $ "image" .Values.processorApi.image) }}
          command: ["pnpm", "--dir", "apps/api", "run", "start:processor-api"]
          ports:
            - name: http
              containerPort: {{ .Values.processorApi.port }}
              protocol: TCP
          env:
            {{- include "decentralized-treasury.apiEnv" . | nindent 12 }}
            - name: PROCESSOR_API_PORT
              value: {{ .Values.processorApi.port | quote }}
            {{- with .Values.processorApi.extraEnvVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.processorApi.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.processorApi.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.processorApi.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "decentralized-treasury.scriptsVolumeMount" . | nindent 12 }}
      volumes:
        {{- include "decentralized-treasury.scriptsVolume" . | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
