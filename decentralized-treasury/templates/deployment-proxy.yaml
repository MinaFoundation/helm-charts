{{- if .Values.proxy.enabled }}
{{- $component := "proxy" }}
{{- $ctx := dict "root" $ "component" $component }}
{{/*
Whether this pod is the thing enforcing the console's basic auth, in which case
it needs the htpasswd file mounted. See the backoffice server block in
configmap-proxy.yaml.
*/}}
{{- $backofficeBasicAuth := and (include "decentralized-treasury.backofficeViaProxy" .) (eq .Values.backoffice.auth.mode "basic") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "decentralized-treasury.componentName" $ctx }}
  labels:
    {{- include "decentralized-treasury.componentLabels" $ctx | nindent 4 }}
  {{- with .Values.proxy.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.proxy.replicaCount }}
  selector:
    matchLabels:
      {{- include "decentralized-treasury.componentSelectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      annotations:
        # Rolls the pods when the routing config changes; nginx does not watch
        # the mounted ConfigMap.
        checksum/config: {{ include (print $.Template.BasePath "/configmap-proxy.yaml") . | sha256sum }}
        {{- if $backofficeBasicAuth }}
        # nginx reads the htpasswd file once per worker start, so a credential
        # change has to roll the pods the same way a config change does.
        checksum/backoffice-auth: {{ include (print $.Template.BasePath "/secret-backoffice-auth.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.proxy.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "decentralized-treasury.componentLabels" $ctx | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "decentralized-treasury.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        # nginx-unprivileged rather than the stock nginx image: it listens on an
        # unprivileged port and runs as a non-root user out of the box, which is
        # what the chart-wide securityContext requires.
        - name: {{ $component }}
          image: {{ include "decentralized-treasury.componentImage" (dict "root" $ "image" .Values.proxy.image) }}
          imagePullPolicy: {{ include "decentralized-treasury.componentPullPolicy" (dict "root" $ "image" .Values.proxy.image) }}
          ports:
            - name: http
              containerPort: {{ .Values.proxy.port }}
              protocol: TCP
          {{- with .Values.proxy.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.proxy.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.proxy.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            # Mounted over the directory, so the default.conf shipped in the
            # image is replaced rather than served alongside ours.
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            {{- if $backofficeBasicAuth }}
            # The htpasswd file auth_basic_user_file points at. Its own mount
            # rather than a key projected into conf.d, so a credential change
            # cannot be mistaken for a routing change.
            - name: backoffice-auth
              mountPath: {{ include "decentralized-treasury.backofficeAuthFilePath" . | dir }}
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "decentralized-treasury.componentName" $ctx }}
        {{- if $backofficeBasicAuth }}
        - name: backoffice-auth
          secret:
            secretName: {{ include "decentralized-treasury.backofficeAuthSecretName" . }}
            items:
              - key: auth
                path: {{ include "decentralized-treasury.backofficeAuthFilePath" . | base }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "decentralized-treasury.componentName" $ctx }}
  labels:
    {{- include "decentralized-treasury.componentLabels" $ctx | nindent 4 }}
  {{- with .Values.proxy.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.proxy.service.type }}
  ports:
    - name: http
      port: {{ .Values.proxy.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "decentralized-treasury.componentSelectorLabels" $ctx | nindent 4 }}
{{- end }}
