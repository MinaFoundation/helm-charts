apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "decentralized-treasury.fullname" . }}-scripts
  labels:
    {{- include "decentralized-treasury.labels" . | nindent 4 }}
data:
  {{- range $path, $_ := .Files.Glob "scripts/*" }}
  {{ $path | trimPrefix "scripts/" }}: |-
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
