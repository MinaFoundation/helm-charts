{{/*
The tally sender's private key, when it is given inline as
tallyScheduler.sender.privateKey rather than as an existing Secret.

The key is still plaintext wherever these values live, so prefer existingSecret
fed from a secrets manager for anything long-lived. The key only pays tally
fees and holds no authority over the treasury, which is what makes the inline
form acceptable at all.
*/}}
{{- if and .Values.tallyScheduler.enabled .Values.tallyScheduler.sender.privateKey (not .Values.tallyScheduler.sender.existingSecret) }}
{{- $ctx := dict "root" $ "component" "tally-scheduler" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "decentralized-treasury.tallySenderSecretName" . }}
  labels:
    {{- include "decentralized-treasury.componentLabels" $ctx | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.tallyScheduler.sender.key }}: {{ .Values.tallyScheduler.sender.privateKey | quote }}
{{- end }}
