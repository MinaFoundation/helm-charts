{{- if hasKey .Values.tallyScheduler "minaNetworkId" -}}
{{- fail "tallyScheduler.minaNetworkId was removed; use chart network" -}}
{{- end -}}
{{- if .Values.serviceAccount.annotations -}}
{{- fail "serviceAccount.annotations is no longer shared: move cloud identities to serviceAccounts.<component>.annotations with least-privilege roles" -}}
{{- end -}}
{{- $components := dict "api" .Values.api.enabled "api-migrate" .Values.apiMigrate.enabled "indexer" .Values.indexer.enabled "indexer-api" .Values.indexerApi.enabled "processor" .Values.processor.enabled "processor-api" .Values.processorApi.enabled "web" .Values.web.enabled "backoffice" .Values.backoffice.enabled "docs" .Values.docs.enabled "proxy" .Values.proxy.enabled "voting-ledger-scheduler" .Values.votingLedgerScheduler.enabled "tally-scheduler" .Values.tallyScheduler.enabled "proving-worker" (and .Values.proving.enabled .Values.proving.worker.enabled) "proving-scheduler" (and .Values.proving.enabled .Values.proving.scheduler.enabled) "artifacts" (and .Values.proving.enabled .Values.proving.scheduler.enabled .Values.proving.scheduler.server.enabled) "redis" (and .Values.proving.enabled .Values.proving.redis.enabled) -}}
{{- $seen := dict -}}
{{- range $component, $enabled := $components -}}
{{- if $enabled -}}
{{- $ctx := dict "root" $ "component" $component -}}
{{- $name := include "decentralized-treasury.serviceAccountName" $ctx -}}
{{- if hasKey $seen $name -}}{{- fail (printf "service account %s is shared by multiple workloads" $name) -}}{{- end -}}
{{- $_ := set $seen $name true -}}
{{- $config := index $.Values.serviceAccounts $component | default dict -}}
{{- if and $config.annotations (not (has $component (list "api" "processor" "voting-ledger-scheduler" "proving-scheduler" "tally-scheduler"))) -}}
{{- fail (printf "serviceAccounts.%s.annotations must be empty: this workload does not need cloud credentials" $component) -}}
{{- end -}}
{{- if $.Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "decentralized-treasury.componentLabels" $ctx | nindent 4 }}
  {{- with $config.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ include "decentralized-treasury.automount" $ctx }}
{{- end -}}
{{- end -}}
{{- end }}
