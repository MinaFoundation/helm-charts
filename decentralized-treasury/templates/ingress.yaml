{{- if .Values.ingress.enabled }}
{{- $host := required "ingress.host is required when ingress.enabled" .Values.ingress.host }}
{{- $webName := include "decentralized-treasury.componentName" (dict "root" $ "component" "web") }}
{{- $webLabels := include "decentralized-treasury.componentLabels" (dict "root" $ "component" "web") }}
{{/*
Replaces the Caddy reverse-proxy services from compose, in one of three modes.

  path (nginx and friends)
    One host, with /api, /indexer and /processor stripped before proxying, the
    way Caddy's `handle_path` did. Stripping needs a rewrite annotation, and
    that annotation applies to every path in the object it is set on - so web
    gets its own Ingress with no rewrite, and the APIs share a second one.
    nginx matches the longest path, so the API prefixes win over web's `/`.

  host (ALB)
    A separate hostname per service and no rewriting at all. The AWS Load
    Balancer Controller has no equivalent of rewrite-target, so path mode
    cannot strip prefixes there and the APIs would receive /api/... and 404.
    This mirrors the PUBLIC_API_DOMAIN / PUBLIC_INDEXER_DOMAIN /
    PUBLIC_PROCESSOR_DOMAIN split in the compose stack's Caddyfile.https.

  proxy (ALB, one hostname)
    One host, routed to the in-cluster proxy, which strips the prefixes itself.
    The controller only ever sees `/`, so this keeps the browser on a single
    origin without needing a controller that can rewrite. Use it when every
    service should share one hostname.

The Caddyfile also proxied /mina/* to a Mina node outside this stack. In proxy
mode that is proxy.minaNodeUpstream; otherwise add it via ingress.extraPaths.

The break-glass console normally gets its own object, in
ingress-backoffice.yaml: it needs authentication, and ingress annotations apply
to a whole Ingress object rather than to one rule, so auth put here would also
gate the public web app - the same reason the API paths get their own.

The exception is `proxy` mode with ingress.hosts.backoffice, where its hostname
is added below and forwarded to the in-cluster proxy. That carries no
annotations at all: nginx applies auth_basic behind the load balancer, so there
is nothing to leak onto web and no second object to own.
*/}}
{{- $rootName := $webName }}
{{- $rootLabels := $webLabels }}
{{- $rootPort := .Values.web.service.port }}
{{- if eq .Values.ingress.mode "proxy" }}
{{- if not .Values.proxy.enabled }}
{{- fail "ingress.mode is `proxy` but proxy.enabled is false: the mode routes everything to the in-cluster proxy, so it has to be deployed" }}
{{- end }}
{{- $rootName = include "decentralized-treasury.componentName" (dict "root" $ "component" "proxy") }}
{{- $rootLabels = include "decentralized-treasury.componentLabels" (dict "root" $ "component" "proxy") }}
{{- $rootPort = .Values.proxy.service.port }}
{{- end }}
{{- $services := list }}
{{- if .Values.api.enabled }}
{{- $services = append $services (dict "key" "api" "component" "api" "port" .Values.api.service.port) }}
{{- end }}
{{- if .Values.indexerApi.enabled }}
{{- $services = append $services (dict "key" "indexer" "component" "indexer-api" "port" .Values.indexerApi.service.port) }}
{{- end }}
{{- if .Values.processorApi.enabled }}
{{- $services = append $services (dict "key" "processor" "component" "processor-api" "port" .Values.processorApi.service.port) }}
{{- end }}
{{- if and (or .Values.ingress.hosts.backoffice .Values.backoffice.pathPrefix) (not .Values.backoffice.enabled) }}
{{- fail "the backoffice is routed (ingress.hosts.backoffice or backoffice.pathPrefix) but backoffice.enabled is false: there would be nothing behind it" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $rootName }}
  labels:
    {{- $rootLabels | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $rootName }}
                port:
                  number: {{ $rootPort }}
          {{- with .Values.ingress.extraPaths }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
    {{- if include "decentralized-treasury.backofficeViaProxy" . }}
    {{/*
    The break-glass console's hostname, forwarded wholesale to the in-cluster
    proxy. The proxy has a server block for this name that serves the console at
    `/` and the daemon at `/mina/`, and applies auth_basic itself.

    It belongs on this object rather than one of its own precisely because
    nothing here is annotation-driven: there is no auth annotation to leak onto
    the public web app, which is what ingress-backoffice.yaml exists to avoid in
    every other mode.
    */}}
    - host: {{ .Values.ingress.hosts.backoffice | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "decentralized-treasury.componentName" (dict "root" $ "component" "proxy") }}
                port:
                  number: {{ .Values.proxy.service.port }}
    {{- end }}
    {{- if eq .Values.ingress.mode "host" }}
    {{- range $service := $services }}
    {{- $serviceHost := index $.Values.ingress.hosts $service.key }}
    {{- if $serviceHost }}
    - host: {{ $serviceHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "decentralized-treasury.componentName" (dict "root" $ "component" $service.component) }}
                port:
                  number: {{ $service.port }}
    {{- end }}
    {{- end }}
    {{- end }}
{{- if eq .Values.ingress.mode "path" }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ printf "%s-apis" $webName | trunc 63 | trimSuffix "-" }}
  labels:
    {{- $webLabels | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.apiAnnotations | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          {{- range $service := $services }}
          - path: {{ $.Values.ingress.apiPathPrefix }}/{{ $service.key }}(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "decentralized-treasury.componentName" (dict "root" $ "component" $service.component) }}
                port:
                  number: {{ $service.port }}
          {{- end }}
{{- end }}
{{- end }}
