{{- if and .Values.proving.enabled .Values.proving.scheduler.enabled .Values.proving.scheduler.server.enabled }}
{{- $ctx := dict "root" $ "component" "artifacts" }}
{{- $writer := dict "root" $ "component" "proving-scheduler" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "decentralized-treasury.componentName" $ctx }}
  labels:
    {{- include "decentralized-treasury.componentLabels" $ctx | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "decentralized-treasury.componentSelectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-artifacts.yaml") . | sha256sum }}
      labels:
        {{- include "decentralized-treasury.componentLabels" $ctx | nindent 8 }}
        treasury.minaprotocol.com/artifact-store: "true"
    spec:
      serviceAccountName: {{ include "decentralized-treasury.serviceAccountName" $ctx }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # ReadWriteOnce permits multiple pods only on the same node.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "decentralized-treasury.componentSelectorLabels" $writer | nindent 18 }}
              topologyKey: kubernetes.io/hostname
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: serve-artifacts
          image: "{{ .Values.proving.scheduler.server.image.repository }}:{{ .Values.proving.scheduler.server.image.tag }}"
          imagePullPolicy: {{ .Values.proving.scheduler.server.image.pullPolicy }}
          command: ["nginx", "-c", "/etc/nginx/nginx.conf", "-g", "daemon off;"]
          ports:
            - name: http
              containerPort: {{ .Values.proving.scheduler.server.port }}
          {{- with .Values.proving.scheduler.server.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.proving.scheduler.server.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: artifacts-nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: sqlite-data
              mountPath: {{ .Values.sqlite.dataDirectory }}
              readOnly: true
            - name: proofs
              mountPath: {{ .Values.proving.scheduler.outputDirectory }}
              readOnly: true
      volumes:
        - name: artifacts-nginx-config
          configMap:
            name: {{ include "decentralized-treasury.fullname" . }}-artifacts-nginx
            defaultMode: 0444
        - name: sqlite-data
          persistentVolumeClaim:
            claimName: {{ include "decentralized-treasury.componentName" $writer }}-sqlite
            readOnly: true
        - name: proofs
          persistentVolumeClaim:
            claimName: {{ include "decentralized-treasury.componentName" $writer }}-proofs
            readOnly: true
{{- end }}
