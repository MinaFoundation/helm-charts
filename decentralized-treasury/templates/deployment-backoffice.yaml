{{- if .Values.backoffice.enabled }}
{{- $component := "backoffice" }}
{{- $ctx := dict "root" $ "component" $component }}
{{/*
The app itself refuses to render with anything other than five participants, so
catch it here instead: a template failure names the problem, where the running
console would only show a configuration error to whoever opened it mid-incident.
*/}}
{{- $participants := .Values.config.multisigParticipantsPublicKeys }}
{{- if ne (len $participants) 5 }}
{{- fail (printf "backoffice.enabled requires exactly 5 config.multisigParticipantsPublicKeys, in the same order as the pause-controller deployment (got %d)" (len $participants)) }}
{{- end }}
{{- if not .Values.config.treasuryOwnerContractAddress }}
{{- fail "backoffice.enabled requires config.treasuryOwnerContractAddress" }}
{{- end }}
{{- if and .Values.backoffice.pathPrefix (not (hasPrefix "/" .Values.backoffice.pathPrefix)) }}
{{- fail (printf "backoffice.pathPrefix must start with a slash (got %q)" .Values.backoffice.pathPrefix) }}
{{- end }}
{{/*
publicBaseUrl derives NEXT_PUBLIC_MINA_NODE_URL as <base>/mina/graphql, which
only resolves if something serves that path on that origin. The proxy is what
does; without it the browser would call a path the console's own Next server
answers, and every operation would fail at submit time rather than at startup.
*/}}
{{- if and .Values.backoffice.publicBaseUrl (not .Values.proxy.enabled) (not (index .Values.backoffice.publicEnv "NEXT_PUBLIC_MINA_NODE_URL")) }}
{{- fail "backoffice.publicBaseUrl derives NEXT_PUBLIC_MINA_NODE_URL as <publicBaseUrl>/mina/graphql, but nothing serves /mina on that origin: proxy.enabled is false. Either enable the proxy, or set NEXT_PUBLIC_MINA_NODE_URL in backoffice.publicEnv to reach the daemon directly." }}
{{- end }}
{{- include "decentralized-treasury.validateBackofficeAuth" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "decentralized-treasury.componentName" $ctx }}
  labels:
    {{- include "decentralized-treasury.componentLabels" $ctx | nindent 4 }}
  {{- with .Values.backoffice.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.backoffice.replicaCount }}
  selector:
    matchLabels:
      {{- include "decentralized-treasury.componentSelectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      {{- with .Values.backoffice.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "decentralized-treasury.componentLabels" $ctx | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "decentralized-treasury.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        # Built from the `backoffice` stage of the Dockerfile: a separate image
        # from both dt-web and the shared services image.
        #
        # Every value below is read at container start - the app writes them
        # into an inline <script> ahead of its bundles and the client reads them
        # from there, so one image serves any network. See devops/PUBLISHING.md
        # in the application repo.
        #
        # No database, no migrations, no init containers: the console signs and
        # submits against the Mina node and never touches Postgres.
        - name: {{ $component }}
          image: {{ include "decentralized-treasury.componentImage" (dict "root" $ "image" .Values.backoffice.image) }}
          imagePullPolicy: {{ include "decentralized-treasury.componentPullPolicy" (dict "root" $ "image" .Values.backoffice.image) }}
          # Standalone Next.js build, as with web: server.js and no package
          # manager, so `pnpm run start` is not available in this image.
          command:
            - node
            - apps/backoffice/server.js
          ports:
            - name: http
              containerPort: {{ .Values.backoffice.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.backoffice.port | quote }}
            - name: HOSTNAME
              value: "0.0.0.0"
            {{- include "decentralized-treasury.backofficePublicEnv" . | nindent 12 }}
            {{- with .Values.backoffice.extraEnvVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.backoffice.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backoffice.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backoffice.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "decentralized-treasury.componentName" $ctx }}
  labels:
    {{- include "decentralized-treasury.componentLabels" $ctx | nindent 4 }}
  {{- with .Values.backoffice.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.backoffice.service.type }}
  ports:
    - name: http
      port: {{ .Values.backoffice.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "decentralized-treasury.componentSelectorLabels" $ctx | nindent 4 }}
{{- end }}
