{{/*
htpasswd Secret for the console's basic auth, in the single-key `auth` form the
nginx ingress expects.

Rendered only when the chart is enforcing basic auth and the operator has not
supplied their own Secret. `htpasswd` here is sprig's, which produces a bcrypt
entry - the passwords in values are hashed before they reach the cluster, though
they are still plaintext wherever those values live, so prefer existingSecret
with a Secrets Manager reference for anything long-lived.
*/}}
{{- if and .Values.backoffice.enabled (eq .Values.backoffice.auth.mode "basic") (not .Values.backoffice.auth.basic.existingSecret) }}
{{- $ctx := dict "root" $ "component" "backoffice" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "decentralized-treasury.backofficeAuthSecretName" . }}
  labels:
    {{- include "decentralized-treasury.componentLabels" $ctx | nindent 4 }}
type: Opaque
stringData:
  auth: |
    {{- range $user, $password := .Values.backoffice.auth.basic.users }}
    {{ htpasswd $user $password }}
    {{- end }}
{{- end }}
