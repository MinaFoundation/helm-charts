{{- if and .Values.proving.enabled .Values.proving.scheduler.enabled .Values.proving.worker.enabled .Values.proving.worker.autoscale.enabled }}
{{- $ctx := dict "root" $ "component" "proving-autoscale" }}
{{- $workerName := include "decentralized-treasury.componentName" (dict "root" $ "component" "proving-worker") }}
{{/*
The only Kubernetes access anything in this chart is granted.

Scoped as tightly as the API allows: a namespaced Role, and resourceNames
limited to the proving worker Deployment, so the token cannot read or scale
anything else in the namespace - including the other workloads of this same
release.

The sidecar only GETs and PATCHes .../scale. It cannot read the parent Deployment.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "decentralized-treasury.componentName" $ctx }}
  labels:
    {{- include "decentralized-treasury.componentLabels" $ctx | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: [{{ $workerName | quote }}]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "decentralized-treasury.componentName" $ctx }}
  labels:
    {{- include "decentralized-treasury.componentLabels" $ctx | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "decentralized-treasury.componentName" $ctx }}
subjects:
  - kind: ServiceAccount
    name: {{ include "decentralized-treasury.serviceAccountName" (dict "root" $ "component" "proving-scheduler") }}
    namespace: {{ .Release.Namespace }}
{{- end }}
