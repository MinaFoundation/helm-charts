{{- if .Values.indexerApi.enabled }}
{{- $ctx := dict "root" $ "component" "indexer-api" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "decentralized-treasury.componentName" $ctx }}
  labels:
    {{- include "decentralized-treasury.componentLabels" $ctx | nindent 4 }}
  {{- with .Values.indexerApi.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.indexerApi.service.type }}
  ports:
    - name: http
      port: {{ .Values.indexerApi.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "decentralized-treasury.componentSelectorLabels" $ctx | nindent 4 }}
{{- end }}
