{{- if .Values.lifecycleFanout.enabled }}
{{- $component := "lifecycle-fanout" }}
{{- $ctx := dict "root" $ "component" $component }}
{{- if lt (.Values.lifecycleFanout.groupSize | int) 2 }}
{{- fail "lifecycleFanout.groupSize must be > 1 when lifecycleFanout.enabled is true - 1 means every id is its own group, i.e. nothing to duplicate" }}
{{- end }}
{{/*
EXPERIMENTAL, never for a production release - see lifecycleFanout in
values.yaml. Singleton: two copies racing the same S3 objects could interleave
a partial duplicate_lifecycle() with another one's markers.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "decentralized-treasury.componentName" $ctx }}
  labels:
    {{- include "decentralized-treasury.componentLabels" $ctx | nindent 4 }}
  {{- with .Values.lifecycleFanout.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "decentralized-treasury.componentSelectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/scripts: {{ include (print $.Template.BasePath "/configmap-scripts.yaml") . | sha256sum }}
        {{- with .Values.lifecycleFanout.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "decentralized-treasury.componentLabels" $ctx | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "decentralized-treasury.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $component }}
          image: "{{ .Values.s3.syncImage.repository }}:{{ .Values.s3.syncImage.tag }}"
          imagePullPolicy: {{ .Values.s3.syncImage.pullPolicy }}
          command: ["/bin/sh", "/scripts/lifecycle-fanout-sync.sh"]
          env:
            - name: SQLITE_S3_BUCKET
              value: {{ required "s3.sqliteBucket is required" .Values.s3.sqliteBucket | quote }}
            - name: PROOFS_S3_BUCKET
              value: {{ required "s3.proofsBucket is required" .Values.s3.proofsBucket | quote }}
            - name: NETWORK
              value: {{ required "network is required" .Values.network | quote }}
            - name: AWS_REGION
              value: {{ .Values.s3.region | quote }}
            - name: LIFECYCLE_FANOUT_GROUP_SIZE
              value: {{ .Values.lifecycleFanout.groupSize | quote }}
            - name: SYNC_INTERVAL_SECONDS
              value: {{ .Values.lifecycleFanout.pollIntervalSeconds | quote }}
            - name: SYNC_ONESHOT
              value: "false"
            # The aws-cli image has no non-root home directory of its own.
            - name: HOME
              value: /tmp
          {{- with .Values.s3.syncImage.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.lifecycleFanout.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "decentralized-treasury.scriptsVolumeMount" . | nindent 12 }}
      volumes:
        {{- include "decentralized-treasury.scriptsVolume" . | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
