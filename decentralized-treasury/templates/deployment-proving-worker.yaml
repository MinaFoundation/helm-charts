{{- if and .Values.proving.enabled .Values.proving.worker.enabled }}
{{- $component := "proving-worker" }}
{{- $ctx := dict "root" $ "component" $component }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "decentralized-treasury.componentName" $ctx }}
  labels:
    {{- include "decentralized-treasury.componentLabels" $ctx | nindent 4 }}
  {{- with .Values.proving.worker.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # Unlike every other worker in this chart, replicas here are the point: BullMQ
  # hands each queued proving job to whichever replica is free, so this count is
  # the size of the proving cluster.
  replicas: {{ .Values.proving.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "decentralized-treasury.componentSelectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      {{- with .Values.proving.worker.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "decentralized-treasury.componentLabels" $ctx | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "decentralized-treasury.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        # Takes work only from redis and needs no database or SQLite cache.
        # PROOFS_ENABLED defaults to true here rather than following the
        # stack-wide default, since producing real proofs is the only reason
        # to run this workload at all.
        - name: {{ $component }}
          image: {{ include "decentralized-treasury.componentImage" (dict "root" $ "image" .Values.proving.worker.image) }}
          imagePullPolicy: {{ include "decentralized-treasury.componentPullPolicy" (dict "root" $ "image" .Values.proving.worker.image) }}
          command:
            - pnpm
            - run
            - cli
            - --
            - worker
            - start
            - --queue-name
            - {{ .Values.proving.queueName | quote }}
            - --redis-host
            - {{ include "decentralized-treasury.redisHost" . | quote }}
            - --redis-port
            - {{ .Values.proving.redis.port | quote }}
          env:
            - name: PROOFS_ENABLED
              value: {{ .Values.proving.worker.proofsEnabled | quote }}
            {{- with .Values.proving.worker.extraEnvVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.proving.worker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: worker-cache
              mountPath: /app/apps/cli/cache
      volumes:
        # Compiled circuit cache. Per-pod rather than shared: it is derived
        # data, and rebuilding it costs startup time but never correctness.
        - name: worker-cache
          emptyDir:
            {{- with .Values.proving.worker.cacheSizeLimit }}
            sizeLimit: {{ . }}
            {{- end }}
      {{- with .Values.proving.worker.nodeSelector | default .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.proving.worker.affinity | default .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.proving.worker.tolerations | default .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
