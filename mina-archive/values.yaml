
# -- Mina network name (e.g.: `mainnet`, `devnet`)
network: network

# -- Database name of the archive node
databaseName: archive

image:
  # -- Docker image repository
  repository: gcr.io/o1labs-192920/mina-archive
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Docker image tag
  tag: 2.0.0berkeley-rc1-1551e2f-focal

serviceAccount:
  # -- Service account annotations
  annotations: {}

postgresql:
  # -- Enable local postgresql database server
  enabled: true
  image:
    # Bitnami stopped publishing versioned tags under `bitnami/` in August 2025;
    # only `latest` and digests remain there. The pinned tag still exists under
    # `bitnamilegacy/`, which is frozen and receives no further updates.
    # The subchart expects the Bitnami image layout (/opt/bitnami paths,
    # POSTGRESQL_* env vars), so the official `postgres` image is not a drop-in.
    repository: bitnamilegacy/postgresql
    tag: 17.6.0-debian-12-r4
  primary:
    # -- Resources preset to set resource requests and limits
    resourcesPreset: "nano"
    # -- Extended configuration to configure postgresql server
    extendedConfiguration: |
      max_connections=500
      max_locks_per_transaction=100
      max_pred_locks_per_relation=100
      max_pred_locks_per_transaction=5000
      max_wal_size=2048
    persistence:
      # -- Enable the persistence for the postgresql server
      enabled: true
      # -- Storage class for the postgresql server volume
      storageClass: ""
      # -- Size of the postgresql server volume
      size: 8Gi
  auth:
    # -- Username for the database
    username: username
    # -- Password for the database
    password: password
    # -- Enable the default postgres user
    enablePostgresUser: false

externalDatabase:
  # To use an existing external database server, set enabled to true.
  # This would ignore the local postgresql server connection.
  enabled: false
  # -- Host for external database connection
  host: host
  # -- Port of external database connection
  port: 5432
  # -- Username of external database connection
  username: username
  # -- Password of external database connection
  password: password

# -- Image to use as postgresql client, used by the dump exporter.
# Only needs psql/pg_dump, so it is not tied to the Bitnami image layout.
# Keep the major version at or above the server, pg_dump refuses a newer one.
postgresClientDockerImage: postgres:17-alpine

dbBootstrap:
  # -- Enable to dbBootstrap job to populate the database schema or dump
  enabled: false

  # -- Instanciate the database on the database server.
  # The published dump opens with its own `CREATE DATABASE`, so leave this
  # disabled when restoring one. Enable it when loading a bare schema instead.
  createDatabase: false

  # -- SQL file urls to execute. Templated, so `.Values` are available, and
  # `[DATE]` is replaced at runtime with the current date (YYYY-MM-DD).
  # Defaults to the daily dump o1-labs publishes for the network.
  sqlFileUrls:
    - https://storage.googleapis.com/mina-archive-dumps/{{ .Values.network }}-archive-dump-[DATE]_0000.sql.tar.gz
    # - https://raw.githubusercontent.com/MinaProtocol/mina/develop/src/app/archive/create_schema.sql

  # -- SQL file urls to pre-download before executing the SQL file urls.
  # Templated in the same way as sqlFileUrls.
  extraSqlFileUrls: []

  # -- Execute SQL inline command before loading the SQL file urls
  # preCustomSql: SELECT session_user, current_database()

  # -- Execute SQL inline command after loading the SQL file urls
  postCustomSql: ALTER DATABASE {{ .Values.databaseName }} SET DEFAULT_TRANSACTION_ISOLATION TO SERIALIZABLE

  # -- Set the bootstrap duration expected to be used by other pods when waiting for the bootstrap to complete, before reaching timeout.
  # Restoring a published dump is a long job, the devnet one is around 400MB
  # compressed, so this allows well beyond the download and restore time.
  maxExpectedDurationInSeconds: 7200 # 2 hours

  # -- Annotations to apply to the job
  annotations: {}

  # -- Annotations to apply to the pod
  podAnnotations: {}

node:
  # -- Replicas number for the archive node deployment
  replicas: 1
  # -- Config file url to be downloaded and used as config file before the server starts
  configFileUrl: ""
  metrics:
    # -- Enable metric service
    enabled: true
  ports:
    # -- Mina archive RPC port number
    rpc: 3086
    # -- Mina archive metric port number
    metrics: 10002
  # -- Extra environment variables for the mina archive process
  extraEnvVars: []
  # -- Extra arguments for the mina archive process
  extraArgs: []
  service:
    # -- Labels to the mina archive service
    labels: {}
    # -- Annotations to the mina archive service
    annotations: {}
  # -- Annotations to the mina archive pods
  podAnnotations: {}

  # -- Readiness probe configuration
  readinessProbe:
    exec:
      command: ["bash", "/scripts/archive-readiness.sh"]

  # -- Resources for the mina archive pods
  resources: {}

nodeApi:
  # -- Enable the archive node GraphQL API (o1-labs/Archive-Node-API)
  enabled: false
  # -- Replicas number for the archive node API deployment
  replicas: 1
  image:
    # -- Docker image repository
    repository: ghcr.io/o1-labs/archive-node-api
    # -- Image pull policy
    pullPolicy: IfNotPresent
    # -- Docker image tag
    tag: "0.0.9"
  ports:
    # -- Port the GraphQL server listens on
    http: 8080
  # -- Serve the GraphiQL playground at `/`
  enableGraphiql: false
  # -- Allow GraphQL schema introspection
  enableIntrospection: false
  # -- Enable request logging
  enableLogging: false
  jaeger:
    # -- Emit traces to a Jaeger collector
    enabled: false
    # -- Jaeger collector endpoint (e.g.: `http://jaeger:14268/api/traces`)
    endpoint: ""
    # -- Service name reported to Jaeger
    serviceName: archive-api
  # -- Extra environment variables for the archive node API process
  extraEnvVars: []
  # -- Annotations to the archive node API pods
  podAnnotations: {}
  # -- Resources for the archive node API pods
  resources: {}

  # -- Readiness probe configuration
  readinessProbe:
    httpGet:
      path: /healthcheck
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10

  # -- Liveness probe configuration
  livenessProbe:
    httpGet:
      path: /healthcheck
      port: http
    initialDelaySeconds: 15
    periodSeconds: 20

  service:
    # -- Type of the archive node API service
    type: ClusterIP
    # -- Port of the archive node API service
    port: 8080
    # -- Labels to the archive node API service
    labels: {}
    # -- Annotations to the archive node API service
    annotations: {}

  ingress:
    # -- Whether to create an Ingress for the archive node API
    enabled: false
    # -- The Ingress Class Name to use
    className: ""
    # -- The Ingress Annotations
    annotations: {}
      # kubernetes.io/tls-acme: "true"
    # -- The Ingress Hosts
    hosts: []
      # - host: archive-api.example.com
      #   paths:
      #     - path: /
      #       pathType: Prefix
    # -- The TLS configuration
    tls: []
    #  - secretName: archive-api-tls
    #    hosts:
    #      - archive-api.example.com

missingBlocksGuardian:
  # -- Enabled missing blocks guardian
  enabled: true
  # -- Suspend the missing blocks guardian execution
  suspend: false
  # -- Frequency to execute the missing blocks guardian
  schedule: "@hourly"
  # -- Annotations to the missing blocks guardian
  podAnnotations: {}
  # -- Seconds before cleaning up the missing blocks guardian execution
  ttlSecondsAfterFinished: 86400
  # -- URL to fetch the pre-computed blocks from. The guardian appends
  # /<network>-<height>-<state_hash>.json, which matches the layout of the
  # bucket o1-labs publishes.
  precomputedBlocksUrl: https://storage.googleapis.com/mina_network_block_data
  # -- URL to auto import a block when running the missing blocks guardian
  autoImportBlockUrl: ""

dumpExporter:
  # -- Enabled dump exporter. Opt in, it publishes a dump of your own database
  # to an S3 bucket you control and needs credentials for it.
  enabled: false
  # -- Suspend the  dump exporter execution
  suspend: false
  # -- Frequency to execute the  dump exporter
  schedule: "@midnight"
  # -- Annotations to the  dump exporter
  podAnnotations: {}
  # -- Seconds before cleaning up the  dump exporter execution
  ttlSecondsAfterFinished: 86400
  s3:
    # -- S3 bucket to export the dump to
    bucket: ""

# -- Node selector for all the pods
nodeSelector: {}
# -- Toleration for all the pods
tolerations: []
# Affinity for all the pods
affinity: {}
