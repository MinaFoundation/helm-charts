network: mainnet
databaseName: archive
image:
  repository: minaprotocol/mina-archive
  tag: 3.0.0-93e0279-bullseye

postgresql:
  enabled: true
  primary:
    resourcesPreset: "2xlarge"
    persistence:
      enabled: false
      storageClass: "ebs-gp3-encrypted"
      size: 8Gi

# A throwaway environment starts from a bare schema rather than a full dump,
# so the job has to create the database itself.
dbBootstrap:
  enabled: true
  createDatabase: true
  sqlFileUrls:
    - https://raw.githubusercontent.com/MinaProtocol/mina/develop/src/app/archive/create_schema.sql
  maxExpectedDurationInSeconds: 1800 # 30 minutes, no dump to restore

node:
  replicas: 1

missingBlocksGuardian:
  enabled: true
  suspend: true
