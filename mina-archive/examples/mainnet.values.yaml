network: mainnet
databaseName: archive
image:
  repository: minaprotocol/mina-archive
  tag: 3.0.0-93e0279-bullseye

postgresql:
  enabled: true
  primary:
    resourcesPreset: "2xlarge"
    persistence:
      enabled: true
      storageClass: "ebs-gp3-encrypted"
      size: 48Gi

# The dump url and the pre-computed blocks url both default to the buckets
# o1-labs publishes, resolved for the network above, so neither is repeated
# here. The dump creates the database itself, hence createDatabase stays off.
dbBootstrap:
  enabled: true

missingBlocksGuardian:
  enabled: true

node:
  replicas: 1
